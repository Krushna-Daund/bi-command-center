databases:
  - name: bi-command-center-db
    databaseName: bi_command_center
    user: bi_user
    plan: free

services:
  - type: keyvalue
    name: bi-command-center-redis
    plan: free
    ipAllowList: []

  - type: web
    name: bi-command-center-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: bi-command-center-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: bi-command-center-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: bi-command-center-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: bi-command-center-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: bi-command-center-db
          property: password
      - key: JWT_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bi-command-center-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: bi-command-center-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
